services:
  postgres-db:
    image: postgres:16-alpine
    container_name: clinic-postgres-db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: clinic_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data

volumes:
  postgres_data_volume: